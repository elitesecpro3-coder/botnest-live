<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotNest | Page Not Found</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://bot-nest.com/" />
  <link rel="icon" href="/assets/logo-icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .not-found-shell {
      min-height: calc(100vh - 220px);
      display: grid;
      place-items: center;
      padding: 96px 0 84px;
      text-align: center;
    }
    .not-found-code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }
    .not-found-shell h1 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin-bottom: 0.75rem;
    }
    .not-found-shell p {
      color: var(--muted);
      max-width: 42ch;
      margin: 0 auto 2rem;
    }
  </style>
</head>
<body>
  <div class="page-glow page-glow-top"></div>

  <header class="site-header" id="top">
    <div class="container nav-wrap">
      <a href="/" class="brand" aria-label="BotNest home">
        <div class="logo">
          <img src="/assets/logo-icon.png" alt="BotNest Logo" width="40" height="40" loading="eager" decoding="async" />
          <span>BotNest</span>
        </div>
      </a>
      <nav class="site-nav" id="site-nav">
        <a href="/#how-it-works">How It Works</a>
        <a href="/#pricing">Pricing</a>
        <a href="/#pricing" class="btn btn-nav">Get Started</a>
      </nav>
    </div>
  </header>

  <main class="not-found-shell">
    <div>
      <p class="not-found-code">404</p>
      <h1>Page Not Found</h1>
      <p>The page you&rsquo;re looking for doesn&rsquo;t exist or has moved.</p>
      <a href="/" class="btn btn-primary">Back to Home</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <div class="footer-branding">
        <p class="footer-title">BotNest</p>
        <p class="footer-tagline">AI-powered lead capture for modern businesses</p>
      </div>
      <div class="footer-meta">
        <p class="footer-copyright">&copy; 2026 BotNest. All rights reserved.</p>
        <div class="footer-links" aria-label="Footer links">
          <a href="/privacy-policy">Privacy Policy</a>
          <a href="/terms">Terms of Service</a>
          <a href="mailto:rick@bot-nest.com">rick@bot-nest.com</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
